[pytest]
testpaths = tests
;addopts = -n logical
; Use below option to temporarily disable pytest-xdist. See https://yossarian.net/til/post/disabling-pytest-xdist-without-removing-it/
 addopts = -n 0

markers =
    network: needs network access and credentials (TerraMatch API, S3, Copernicus DEM). Skip with: pytest -m "not network"
